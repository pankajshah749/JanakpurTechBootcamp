    <style>
      /* ===== Loader ===== */
      .site-loader { position:fixed; inset:0; z-index:9999; display:grid; place-items:center; background:#fbfaf7; transition:opacity .5s ease, visibility .5s; }
      .site-loader.is-done { opacity:0; visibility:hidden; }
      .site-loader-inner { display:flex; flex-direction:column; align-items:center; gap:22px; }
      .site-loader-mark { position:relative; width:96px; height:96px; display:grid; place-items:center; }
      .site-loader-mark img { width:70px; height:70px; object-fit:contain; animation:loader-pop 1.4s cubic-bezier(.34,1.56,.64,1) infinite; }
      .site-loader-mark::before { content:""; position:absolute; inset:0; border-radius:50%; border:3px solid rgba(37,99,235,.15); border-top-color:#2563eb; animation:loader-spin 1s linear infinite; }
      .site-loader-word { width:220px; max-width:60vw; opacity:0; animation:loader-rise .7s .2s ease forwards; }
      @keyframes loader-spin { to { transform:rotate(360deg); } }
      @keyframes loader-pop { 0%,100% { transform:scale(.92); } 50% { transform:scale(1.04); } }
      @keyframes loader-rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
      @media (prefers-reduced-motion: reduce) { .site-loader-mark img, .site-loader-mark::before { animation:none; } .site-loader-word { animation:none; opacity:1; } }
    </style>
  </head>
  <body>
    <div id="site-loader" class="site-loader" role="status" aria-label="Loading">
      <div class="site-loader-inner">
        <div class="site-loader-mark"><img src="/images/logo-mark.png" alt="" /></div>
        <img class="site-loader-word" src="/images/bootcampLogo.png" alt="Janakpur Tech Bootcamp" />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
